# VulnBank Pull Request Security Gate
# Runs on pushes to main and vulnerable-lab, and on pull requests targeting those branches.
# Every job must pass before a change is considered security-approved for merge.

name: Security Pipeline

on:
  push:
    branches:
      - main
      - vulnerable-lab
  pull_request:
    branches:
      - main
      - vulnerable-lab

# Least privilege by default; jobs add only the permissions they require.
permissions:
  contents: read

concurrency:
  group: security-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Functional and security regression tests (pytest)
  # ---------------------------------------------------------------------------
  test:
    name: PR Security Gate — Test Suite (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Run pytest (fail on any test failure)
        run: pytest -v

  # ---------------------------------------------------------------------------
  # 2. SAST — static analysis for common Python security issues (Bandit)
  # ---------------------------------------------------------------------------
  sast:
    name: PR Security Gate — SAST (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies (Bandit)
        run: pip install -r requirements-dev.txt

      - name: Run Bandit SAST against app/ (fail on findings)
        # -r app/ : scan application source only
        # -ll      : report medium severity and above
        # Bandit exits non-zero when issues are found, failing this job.
        run: bandit -r app/ -ll -f txt

  # ---------------------------------------------------------------------------
  # 3. SCA — dependency vulnerability scanning (pip-audit)
  # ---------------------------------------------------------------------------
  dependency-scan:
    name: PR Security Gate — SCA (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies (pip-audit)
        run: pip install -r requirements-dev.txt

      - name: Run pip-audit SCA on requirements.txt (fail on CVEs)
        # Audit declared dependencies only — not every tool installed on the runner.
        run: pip-audit -r requirements.txt

  # ---------------------------------------------------------------------------
  # 4. Secret scanning — detect accidentally committed credentials (Gitleaks)
  # ---------------------------------------------------------------------------
  secret-scan:
    name: PR Security Gate — Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks secret scan (fail on detected secrets)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 5. DAST — dynamic application security testing (OWASP ZAP)
  # ---------------------------------------------------------------------------
  dast:
    name: PR Security Gate — DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DAST_JWT_SECRET_KEY: ci-dast-only-secret-not-for-production-use!
      DAST_DATABASE_URL: sqlite:////tmp/vulnbank_dast.sqlite
      DAST_BASE_URL: http://127.0.0.1:5000
      ZAP_WORKSPACE: ${{ github.workspace }}
    steps:
      - name: Check out pull request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Start VulnBank for DAST (isolated SQLite, CI-only secret)
        run: |
          python security/dast/start_ci_server.py &
          echo $! > dast-server.pid

      - name: Wait until GET /health responds successfully
        run: python security/dast/wait_for_health.py

      - name: Run OWASP ZAP baseline scan against localhost
        run: |
          docker run --rm --network host \
            -v "${ZAP_WORKSPACE}:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:5000 \
            -J /zap/wrk/zap-report.json \
            -r /zap/wrk/zap-report.html \
            -w /zap/wrk/zap-report.md \
            -c /zap/wrk/security/dast/zap-baseline.conf \
            -I

      - name: Run authenticated DAST regression checks
        run: python security/dast/regression_checks.py

      - name: Stop VulnBank
        if: always()
        run: |
          if [ -f dast-server.pid ]; then
            kill "$(cat dast-server.pid)" || true
          fi

      - name: Upload ZAP reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-dast-reports
          path: |
            zap-report.json
            zap-report.html
            zap-report.md

  # ---------------------------------------------------------------------------
  # 6. Container image scanning (Trivy)
  # ---------------------------------------------------------------------------
  container-scan:
    name: PR Security Gate — Container Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build VulnBank Docker image
        run: docker build -t vulnbank:ci .

      - name: Scan image with Trivy (fail on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vulnbank:ci
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # 7. SBOM — container software inventory (Syft / CycloneDX)
  # ---------------------------------------------------------------------------
  sbom:
    name: PR Security Gate — SBOM (Syft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build VulnBank Docker image for SBOM
        run: docker build -t vulnbank:sbom .

      - name: Generate CycloneDX SBOM from container image with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: vulnbank:sbom
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate CycloneDX SBOM structure
        run: python security/sbom/validate_sbom.py sbom.cdx.json

      - name: Upload CycloneDX SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnbank-sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 8. IaC / deployment configuration scanning (Checkov)
  # ---------------------------------------------------------------------------
  iac-scan:
    name: PR Security Gate — IaC Scan (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Checkov (development dependency)
        run: pip install -r requirements-dev.txt

      - name: Run Checkov on Dockerfile
        run: checkov -f Dockerfile --framework dockerfile --compact --quiet

      - name: Run Checkov on docker-compose.yml
        run: checkov -f docker-compose.yml --framework yaml --compact --quiet
