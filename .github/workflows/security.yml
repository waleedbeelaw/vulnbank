# VulnBank DevSecOps security pipeline
# Runs on every push and pull request to catch regressions before merge.

name: Security Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Python test suite — functional and security regression tests
  # ---------------------------------------------------------------------------
  test:
    name: Python Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v

  # ---------------------------------------------------------------------------
  # 2. SAST — static analysis for common Python security issues
  # ---------------------------------------------------------------------------
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit against app/
        # -r app/     : scan application source only
        # -ll         : report medium severity and above
        # exit code 1 : fail the job when findings are present
        run: bandit -r app/ -ll -f txt

  # ---------------------------------------------------------------------------
  # 3. Dependency vulnerability scanning
  # ---------------------------------------------------------------------------
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit declared dependencies with pip-audit
        # Scan requirements.txt rather than every tool on the runner (e.g. pip itself).
        run: pip-audit -r requirements.txt

  # ---------------------------------------------------------------------------
  # 4. Secret scanning — detect accidentally committed credentials
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history helps Gitleaks detect secrets in any commit.
          fetch-depth: 0

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
