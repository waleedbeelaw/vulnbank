# VulnBank development stack
#
# DEVELOPMENT-ONLY EXAMPLE CREDENTIALS — not for production.
# Override via environment variables or a local .env file (see .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vulnbank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnbank-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-vulnbank}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulnbank} -d ${POSTGRES_DB:-vulnbank}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vulnbank}:${POSTGRES_PASSWORD:-vulnbank-dev-password}@db:5432/${POSTGRES_DB:-vulnbank}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-docker-dev-jwt-secret-not-for-production-use}
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: "5000"
      FLASK_DEBUG: "false"
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres_data:
