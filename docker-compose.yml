# VulnBank development stack — fake credentials for local use only.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vulnbank
      POSTGRES_PASSWORD: vulnbank-dev-password
      POSTGRES_DB: vulnbank
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnbank -d vulnbank"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vulnbank:vulnbank-dev-password@db:5432/vulnbank
      JWT_SECRET_KEY: docker-dev-jwt-secret-not-for-production-use
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: "5000"
      FLASK_DEBUG: "false"
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
