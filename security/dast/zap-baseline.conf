# OWASP ZAP baseline rule configuration for VulnBank DAST (CI only).
#
# Format: RULE_ID<TAB>ACTION<TAB>(Rule name)
# Actions: IGNORE | INFO | WARN | FAIL
# Tab-separated — spaces are not valid separators.
#
# zap-baseline.py performs spidering + passive scanning only (not full active injection).
# CI failure behaviour (with -I):
#   FAIL  -> exit code 1 (blocks the PR security gate)
#   WARN  -> reported in logs/reports; does not fail CI when -I is used
#   IGNORE -> not reported
#
# Unlisted rules default to WARN. With -I, WARN findings stay visible without blocking
# merge. Use IGNORE only for findings genuinely inapplicable to localhost CI.

# --- IGNORE: genuinely inapplicable or unavoidable in localhost CI ---

10035	IGNORE	(Strict-Transport-Security Header Not Set)
10096	IGNORE	(Timestamp Disclosure)
10202	IGNORE	(Absence of Anti-CSRF Tokens)

# --- FAIL: passive or spider-observed findings that must block the PR security gate ---
#
# Note: many rule IDs below are active-scan rules. zap-baseline.py does NOT actively
# inject SQLi/path-traversal/XSS payloads. FAIL here means "fail CI if this alert is
# raised by passive analysis or spidering." Targeted active checks for remediated flaws
# are performed by security/dast/regression_checks.py.

40014	FAIL	(Cross Site Scripting (Persistent))
90022	FAIL	(Application Error Disclosure)
