# OWASP ZAP baseline rule configuration for VulnBank DAST (CI only).
#
# Format: RULE_ID  ACTION  # justification
# Only narrow, documented suppressions belong here. Do not disable whole categories.
#
# VulnBank is a local JSON-first Flask API scanned over HTTP in CI. Several passive
# header rules are accepted because they reflect development/lab deployment, not
# production internet-facing hosting with TLS termination.

10020   IGNORE   # X-Frame-Options Header Missing — JSON API; no browser framing use case in CI
10021   IGNORE   # X-Content-Type-Options Header Missing — Flask dev-style responses in isolated CI scan
10035   IGNORE   # Strict-Transport-Security Header Not Set — CI scan uses http://127.0.0.1 only
10036   IGNORE   # Server leaks version information via "Server" HTTP Response Header — acceptable in lab CI
10096   IGNORE   # Timestamp Disclosure — created_at fields in JSON responses are intentional API data
10109   IGNORE   # Modern Web Application — ZAP heuristic; VulnBank is primarily a REST API
